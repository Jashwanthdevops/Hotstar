name: Build Push Deploy to EKS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Build Docker Image
        run: |
          docker build -t hotstar:${{ github.run_number }} .

      - name: Tag Docker Image
        run: |
          docker tag hotstar:${{ github.run_number }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Push Docker Image to ECR
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Update Kubernetes Deployment Manifest
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" K8S/deployment.yml

          echo "Updated deployment.yml:"
          cat K8S/deployment.yml

      - name: Deploy Application to EKS
        run: |
          kubectl apply -f K8S/

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/hotstar-app --timeout=300s

      - name: Verify Kubernetes Resources
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Hotstar Deployment Successful
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            Hotstar Deployment Successful

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run Number: ${{ github.run_number }}

            Docker Image:
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Hotstar Deployment Failed
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            Hotstar Deployment Failed

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run Number: ${{ github.run_number }}

            Please check the GitHub Actions logs for more details.
