name: Build Push Deploy to EKS

on:
push:
branches:
- master

env:
AWS_REGION: ${{ secrets.AWS_REGION }}
ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

deploy:
runs-on: ubuntu-latest

```
steps:

  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Login to ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build Docker Image
    run: |
      docker build -t hotstar:${{ github.run_number }} .

  - name: Tag Docker Image
    run: |
      docker tag hotstar:${{ github.run_number }} \
      ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

  - name: Push Image to ECR
    run: |
      docker push \
      ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig \
      --region $AWS_REGION \
      --name $EKS_CLUSTER_NAME

  - name: Update Deployment Manifest
    run: |
      IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

      sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" K8S/deployment.yaml

  - name: Deploy to EKS
    run: |
      kubectl apply -f K8S/
      kubectl rollout status deployment/hotstar

  - name: Verify Deployment
    run: |
      kubectl get pods
      kubectl get svc

  - name: Send Success Email
    if: success()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      username: ${{ secrets.EMAIL_USERNAME }}
      password: ${{ secrets.EMAIL_PASSWORD }}
      subject: Hotstar Deployment Successful
      to: ${{ secrets.EMAIL_TO }}
      from: GitHub Actions
      secure: true
      body: |
        Deployment Successful

        Repository: ${{ github.repository }}
        Branch: ${{ github.ref_name }}
        Run Number: ${{ github.run_number }}

  - name: Send Failure Email
    if: failure()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      username: ${{ secrets.EMAIL_USERNAME }}
      password: ${{ secrets.EMAIL_PASSWORD }}
      subject: Hotstar Deployment Failed
      to: ${{ secrets.EMAIL_TO }}
      from: GitHub Actions
      secure: true
      body: |
        Deployment Failed

        Repository: ${{ github.repository }}
        Branch: ${{ github.ref_name }}
        Run Number: ${{ github.run_number }}
```
